<template>
   <div class="search-box">
    <lightning-input
        label="Speaker Name"
        value={name}
        onchange={handleNameChange}>
    </lightning-input>

    <lightning-combobox
        label="Speciality"
        options={specialityOptions}
        value={speciality}
        onchange={handleSpecialityChange}>
    </lightning-combobox>

    <div class="btn-row">
        <lightning-button
            label="Search"
            variant="brand"
            onclick={handleSearch}>
        </lightning-button>
    </div>
</div>
</template>
