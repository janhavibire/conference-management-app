<template>
    <lightning-card title="Search Speakers">
        <div class="slds-p-around_medium">

            <lightning-input
                label="Speaker Name"
                onchange={handleNameChange}>
            </lightning-input>

            <lightning-combobox
                label="Speciality"
                options={options}
                onchange={handleSpecialityChange}>
            </lightning-combobox>

            <lightning-button
                label="Search"
                variant="brand"
                class="slds-m-top_medium"
                onclick={handleSearch}>
            </lightning-button>

        </div>
    </lightning-card>
</template>
